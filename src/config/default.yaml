# --- Defaults ---

# --- pymarl options ---
runner: "episode" # Runs 1 env for an episode
mac: "basic_mac" # Basic controller
env: "sc2" # Environment name
common_reward: True  # Run experiment with common reward setup
reward_scalarisation: "sum"  # How to aggregate rewards to single common reward (only used if common_reward is True)
env_args: {} # Arguments for the environment
batch_size_run: 1 # Number of environments to run in parallel
test_nepisode: 20 # Number of episodes to test for
test_interval: 2000 # Test after {} timesteps have passed
test_greedy: True # Use greedy evaluation (if False, will set epsilon floor to 0
log_interval: 2000 # Log summary of stats after every {} timesteps
runner_log_interval: 2000 # Log runner stats (not test stats) every {} timesteps
learner_log_interval: 2000 # Log training stats every {} timesteps
t_max: 10000 # Stop running after this many timesteps
use_cuda: True # Use gpu by default unless it isn't available
buffer_cpu_only: True # If true we won't keep all of the replay buffer in vram

# --- Logging options ---
use_tensorboard: False # Log results to tensorboard
selma_log_csv: "" # SELMA: path for per-episode per-agent return CSV (empty = disabled)
selma_mode: "off" # SELMA: off | shadow | active. off = unchanged plain QMIX; shadow = Stage B detector only; active = Stage C guidance + PBRS. Unknown modes are rejected
selma_shadow_csv: "" # SELMA: path for the Stage B shadow detector CSV (empty = disabled)
selma_shadow_summary_json: "" # SELMA: path for the Stage B per-variant calibration summary (empty = disabled)
selma_rearm_steps: 3 # SELMA Stage B lifecycle (calibration value, not a frozen setting)
selma_cooldown_steps: 5 # SELMA Stage B lifecycle (calibration value, not a frozen setting)
selma_max_events_per_episode: 2 # SELMA Stage B lifecycle (calibration value, not frozen)
selma_w_inbound: 3 # SELMA Stage B inbound-help window (shadow comparison only)
selma_variant_id: "" # SELMA: restrict the detector bank to one variant id (empty = all 48, shadow calibration). Required, and must be the frozen variant, in active mode
selma_beta: 0.0 # SELMA Stage C: PBRS shaping scale, applied exactly once. 0.0 = no shaping (default; bit-identical to off)
selma_provider: "none" # SELMA: none | deterministic_mock | openai. Legal only with selma_mode=active; openai is disabled unless named here explicitly
selma_guidance_log_csv: "" # SELMA Stage C: path for the per-transition PBRS log (empty = disabled)
selma_decision_log_csv: "" # SELMA Stage D: path for the per-detector-event decision/measurement log, incl. semantic cache-key digest (empty = disabled)
# --- SELMA Stage D: provider cache and live-call budget. All inert by default;
# the OpenAI provider is disabled unless selma_provider is set to it explicitly.
selma_cache_mode: "off" # SELMA Stage D: off | read_write | read_only. Legal only with selma_mode=active
selma_cache_path: "" # SELMA Stage D: SQLite cache path. Required when the cache is on; one database per condition/seed/run
selma_cache_allow_shared_write: False # SELMA Stage D: permit reopening another run's writable cache (never silently)
selma_live_call_cap: 2000 # SELMA Stage D: hard per-run cap on live provider calls; every HTTP attempt (including retries) consumes it. Provisional, not experimentally frozen
selma_provider_timeout_s: 30.0 # SELMA Stage D: per-attempt wall-clock timeout
selma_provider_max_retries: 1 # SELMA Stage D: retries after the first attempt; each retry is a live call
selma_provider_backoff_s: 0.5 # SELMA Stage D: base backoff between attempts (exponential)
selma_provider_max_output_tokens: 512 # SELMA Stage D: bounded output length
selma_price_table_date: "" # SELMA Stage D: dated price table used to recompute cost from stored token counts (cost is never hard-coded)
selma_price_input_usd_per_mtok: 0.0 # SELMA Stage D: USD per 1M input tokens, from the dated table above. 0 = cost not calculated
selma_price_cached_input_usd_per_mtok: 0.0 # SELMA Stage D: USD per 1M provider-side cached-input tokens (NOT the SQLite response cache)
selma_price_output_usd_per_mtok: 0.0 # SELMA Stage D: USD per 1M output tokens
selma_cost_cap_usd: 0.0 # SELMA Stage D: conservative spend ceiling checked before every live attempt; requires the dated rates above. 0 = no monetary ceiling
use_wandb: False # Log results to W&B
wandb_team: null # W&B team name
wandb_project: null # W&B project name
wandb_mode: "offline" # W&B mode (online/offline)
wandb_save_model: False # Save models to W&B (only done if use_wandb is True and save_model is True)
save_model: False # Save the models to disk
save_model_interval: 50000 # Save models after this many timesteps
checkpoint_path: "" # Load a checkpoint from this path
evaluate: False # Evaluate model for test_nepisode episodes and quit (no training)
render: False # Render the environment when evaluating (only when evaluate == True)
load_step: 0 # Load model trained on this many timesteps (0 if choose max possible)
save_replay: False # Saving the replay of the model loaded from checkpoint_path
local_results_path: "results" # Path for local results

# --- RL hyperparameters ---
gamma: 0.99
batch_size: 32 # Number of episodes to train on
buffer_size: 32 # Size of the replay buffer
lr: 0.0005 # Learning rate for agents
optim_alpha: 0.99 # RMSProp alpha
optim_eps: 0.00001 # RMSProp epsilon
grad_norm_clip: 10 # Reduce magnitude of gradients above this L2 norm
add_value_last_step: True

# --- Agent parameters ---
agent: "rnn" # Default rnn agent
hidden_dim: 64 # Size of hidden state for default rnn agent
obs_agent_id: True # Include the agent's one_hot id in the observation
obs_last_action: True # Include the agent's last action (one_hot) in the observation

# --- Experiment running params ---
repeat_id: 1
label: "default_label"
hypergroup: null